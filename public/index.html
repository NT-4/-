<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>リアルタイムビンゴ</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f1020">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BINGO">
</head>
<body>
  <main class="wrap">
    <header style="text-align:center;margin:20px 0 28px">
      <div class="logo">BINGO</div>
      <p class="muted">スマホ・タブレット・PC からそのまま参加できるリアルタイムビンゴ</p>
    </header>

    <div id="install"></div>
    <section class="panel hidden" id="my-joined" style="margin-bottom:16px">
      <h2 style="font-size:1.1rem">参加中のゲーム</h2>
      <div class="my-rooms" id="joined-list"></div>
    </section>

    <div class="grid-2">
      <section class="panel" id="join-panel">
        <div id="join-hero" class="join-hero hidden">
          <div class="muted small">ビンゴ大会に招待されています</div>
          <div class="event" id="event-title"></div>
        </div>
        <h2 id="join-heading">参加する</h2>
        <form id="join">
          <div id="code-wrap">
            <label for="code">ルームコード</label>
            <input id="code" name="code" autocomplete="off" maxlength="5" placeholder="例: K7Q2M" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800" required>
          </div>
          <label for="name">ニックネーム</label>
          <input id="name" name="name" maxlength="20" placeholder="例: たいち" required>
          <p style="margin-top:16px"><button class="big" type="submit">参加する</button></p>
        </form>
      </section>

      <section class="panel" id="create-panel">
        <h2>ゲームを作る（主催者）</h2>
        <form id="create">
          <label for="title">イベント名</label>
          <input id="title" name="title" maxlength="40" placeholder="例: 2026 忘年会ビンゴ">
          <div class="grid-2" style="gap:0 12px">
            <div>
              <label for="pattern">ビンゴ成立条件</label>
              <select id="pattern" name="pattern">
                <option value="line">1列（縦・横・斜め）</option>
                <option value="cross">十字</option>
                <option value="corners">四隅</option>
                <option value="full">全開け</option>
              </select>
            </div>
            <div>
              <label for="cards">1人あたりのカード枚数</label>
              <select id="cards" name="cardsPerPlayer">
                <option>1</option><option>2</option><option>3</option><option>4</option>
              </select>
            </div>
          </div>
          <label for="prizes">景品（1行に1つ・上から1位, 2位…）</label>
          <textarea id="prizes" name="prizes" placeholder="Nintendo Switch&#10;Amazonギフト券 1万円&#10;高級コーヒー豆"></textarea>
          <p style="margin-top:16px"><button class="big pink" type="submit">ルームを作成</button></p>
        </form>
        <div id="my-rooms" class="small muted"></div>
      </section>
    </div>
  </main>

  <script type="module">
    import { api, storage, toast, el, renderInstallHint } from '/js/common.js';

    renderInstallHint(document.getElementById('install'));

    const qsRoom = (new URLSearchParams(location.search).get('room') ?? '').toUpperCase();
    document.getElementById('name').value = storage.get('bingo.name') ?? '';

    // QR / 共有リンクから来た人は「名前を入れて参加」だけの画面にする
    if (qsRoom) {
      document.getElementById('code').value = qsRoom;
      if (storage.get(`bingo.player.${qsRoom}`)?.token) location.replace(`/play?room=${qsRoom}`);
      api(`/api/rooms/${qsRoom}`).then((room) => {
        document.getElementById('event-title').textContent = room.settings.title;
        document.getElementById('join-hero').classList.remove('hidden');
        document.getElementById('join-heading').textContent = 'ニックネームを入れて参加';
        document.getElementById('code-wrap').classList.add('hidden');
        document.getElementById('create-panel').classList.add('hidden');
        document.getElementById('name').focus();
      }).catch(() => toast('ルームが見つかりません。コードを確認してください'));
    }

    document.getElementById('join').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const room = String(f.get('code')).trim().toUpperCase();
      const name = String(f.get('name')).trim();
      storage.set('bingo.name', name);
      const saved = storage.get(`bingo.player.${room}`);
      if (saved?.token) return (location.href = `/play?room=${room}`);
      try {
        const res = await api(`/api/rooms/${room}/join`, { name });
        storage.set(`bingo.player.${room}`, res);
        location.href = `/play?room=${room}`;
      } catch (err) {
        toast(err.message);
      }
    });

    document.getElementById('create').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        const res = await api('/api/rooms', {
          title: f.get('title'),
          pattern: f.get('pattern'),
          cardsPerPlayer: f.get('cardsPerPlayer'),
          prizes: f.get('prizes'),
        });
        storage.set(`bingo.host.${res.roomId}`, res.hostToken);
        const list = storage.get('bingo.hostRooms') ?? [];
        storage.set('bingo.hostRooms', [res.roomId, ...list.filter((r) => r !== res.roomId)].slice(0, 10));
        location.href = `/host?room=${res.roomId}`;
      } catch (err) {
        toast(err.message);
      }
    });

    // アプリとして起動した時にすぐ戻れるよう、この端末で参加中のゲームを表示
    let joined = [];
    try {
      joined = Object.keys(localStorage)
        .filter((k) => k.startsWith('bingo.player.') && storage.get(k)?.token)
        .map((k) => k.slice('bingo.player.'.length))
        .slice(0, 10);
    } catch {
      /* ストレージ不可 */
    }
    Promise.all(joined.map((r) => api(`/api/rooms/${r}`).then((info) => ({ r, info })).catch(() => null))).then((list) => {
      const alive = list.filter(Boolean);
      if (!alive.length) return;
      document.getElementById('joined-list').replaceChildren(...alive.map(({ r, info }) =>
        el('a', { href: `/play?room=${r}` },
          el('span', {}, info.settings.title),
          el('span', { class: 'muted small' }, `${r} ▶`))));
      document.getElementById('my-joined').classList.remove('hidden');
    });

    const rooms = storage.get('bingo.hostRooms') ?? [];
    if (rooms.length) {
      document.getElementById('my-rooms').append(
        el('p', {}, '最近作成したルーム: ', ...rooms.map((r) => [el('a', { href: `/host?room=${r}` }, r), ' '])),
      );
    }
  </script>
</body>
</html>
