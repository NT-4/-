<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd21f">
<title>日付が踊る</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Mochiy+Pop+One&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed flat-color "scenes" cut on the beat; words are absolutely placed type objects that fly, stamp and bounce; finale = stacked date poster that re-lays itself every bar. Single pop look by design. */
:root{
  --ink:#141016;
  --cream:#fff4e0;
  --tomato:#ff4d2e;
  --cobalt:#2340ff;
  --sun:#ffd21f;
  --pink:#ff7ac8;
  --mint:#29e3a2;
  --f-lat:"Bowlby One","Arial Black","Impact",sans-serif;
  --f-jp:"Mochiy Pop One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-mono:"DM Mono","Menlo","Consolas",monospace;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--cream);font-family:var(--f-mono);-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;background:var(--ink)}
.bgl{position:absolute;inset:0}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
#txt{position:fixed;inset:0;z-index:2;overflow:hidden;pointer-events:none}

/* type objects */
.w{position:absolute;translate:-50% -50%;white-space:nowrap;line-height:1;--sh:var(--ink)}
.ch{display:inline-block;transform-origin:50% 80%}
.lat{font-family:var(--f-lat);letter-spacing:-.01em}
.jp{font-family:var(--f-jp)}
.hs{text-shadow:.06em .06em 0 var(--sh)}
.xl{font-size:min(30vw,40vh)}
.l{font-size:min(17vw,24vh)}
.m{font-size:min(10vw,13vh)}
.s{font-size:min(5.5vw,6vh)}

/* kinetic wall */
.wall{position:absolute;left:-60%;right:-60%;top:-20%;bottom:-20%;display:flex;flex-direction:column;justify-content:center;gap:1vh;rotate:-9deg}
.row{white-space:nowrap;font-family:var(--f-lat);font-size:min(11vw,12vh);line-height:1.05;color:var(--cream)}
.row:nth-child(even){color:transparent;-webkit-text-stroke:2px var(--sun)}

/* month grid */
.mgrid{position:absolute;left:50%;top:50%;translate:-50% -50%;display:grid;gap:min(1.6vw,1.6vh);width:min(92vw,112vh)}
.tile{aspect-ratio:4/3;display:grid;place-items:center;font-family:var(--f-jp);font-size:min(6vw,7vh);color:var(--ink);box-shadow:.12em .12em 0 var(--ink);border:3px solid var(--ink)}

/* calendar */
.cal{position:absolute;left:50%;top:52%;translate:-50% -50%;width:min(92vw,60vh);display:flex;flex-direction:column;gap:10px}
.cal h3{margin:0;font-family:var(--f-lat);font-weight:400;font-size:min(10vw,8vh);color:var(--ink);line-height:1}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;position:relative}
.cg div{aspect-ratio:1;display:grid;place-items:center;font-family:var(--f-lat);font-size:min(4.6vw,4vh);color:var(--ink);background:var(--cream);border:2px solid var(--ink)}
.cg .hd{background:none;border:0;font-family:var(--f-jp);font-size:min(4vw,3.4vh);aspect-ratio:auto;padding-block:4px}
.cg .hd.sun{color:var(--tomato)} .cg .hd.sat{color:var(--cobalt)}
.cg .blank{background:none;border:0}
.cg .hit{background:var(--tomato);color:var(--cream)}
.cg .ring{position:absolute;aspect-ratio:auto;background:none;border:5px solid var(--tomato);border-radius:50%;pointer-events:none;transition:left .05s,top .05s;box-sizing:border-box}

/* finale poster */
#final{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(2vh,16px);text-align:center}
.fy{font-family:var(--f-lat);font-size:min(13vw,15vh);line-height:1;display:flex;align-items:baseline;gap:.35em}
.fy .era{font-family:var(--f-jp);font-size:.38em}
.fmd{font-family:var(--f-lat);font-size:min(22vw,30vh);line-height:.95;white-space:nowrap}
.fmd .k{font-family:var(--f-jp);font-size:.38em;margin-inline:.04em}
.fwd{display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap;justify-content:center}
.fwd .j{font-family:var(--f-jp);font-size:min(10vw,11vh);line-height:1}
.fwd .e{font-family:var(--f-lat);font-size:min(5vw,5.5vh);letter-spacing:.08em}
#final.L0{color:var(--cream)} #final.L0 .k,#final.L0 .era{color:var(--sun)}
#final.L0 .ch{text-shadow:.05em .05em 0 var(--ink)}
#final.L1{color:var(--cream);rotate:-7deg} #final.L1 .fmd{color:var(--sun)} #final.L1 .ch{text-shadow:.05em .05em 0 var(--ink)}
#final.L2{color:var(--ink)} #final.L2 .fmd .n{color:transparent;-webkit-text-stroke:min(.8vw,4px) var(--ink)} #final.L2 .k{color:var(--tomato)}
#final.L3{color:var(--cream)}
#final.L3 .ch:nth-child(5n+1){color:var(--sun)} #final.L3 .ch:nth-child(5n+2){color:var(--pink)}
#final.L3 .ch:nth-child(5n+3){color:var(--mint)} #final.L3 .ch:nth-child(5n+4){color:var(--tomato)}

#info{position:fixed;left:0;right:0;bottom:0;z-index:3;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:12px;letter-spacing:.08em;opacity:0;transition:opacity .5s;color:var(--cream);text-shadow:0 1px 0 var(--ink)}
#info span{background:var(--ink);color:var(--cream);padding:3px 8px;text-shadow:none}
.live #info{opacity:1}
#flash{position:fixed;inset:0;z-index:4;background:var(--cream);opacity:0;pointer-events:none}
#flash.go{animation:fl .45s ease-out both}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}

#ctrl{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 16px);display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .4s}
.live #ctrl{opacity:1;pointer-events:auto}
#ctrl button,#sndHint{font:inherit;font-size:12px;letter-spacing:.06em;background:var(--ink);color:var(--cream);border:2px solid var(--cream);padding:6px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--cream)}
#ctrl button:hover{background:var(--sun);color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
#sndHint{position:fixed;z-index:6;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);background:var(--sun);color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:13px;padding:9px 14px}

/* gate */
#gate{position:fixed;inset:0;z-index:7;background:var(--sun);color:var(--ink);display:grid;place-content:center;justify-items:center;gap:22px;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:clip-path .45s cubic-bezier(.7,0,.2,1);clip-path:circle(150% at 50% 60%)}
#gate.gone{clip-path:circle(0% at 50% 60%);pointer-events:none}
#gate .k{font-size:13px;letter-spacing:.3em}
#gate h1{margin:0;font-family:var(--f-jp);font-weight:400;font-size:clamp(46px,12vw,140px);line-height:1.05}
#gate h1 span{display:inline-block;animation:bob 1.1s cubic-bezier(.5,0,.5,1) infinite;text-shadow:.06em .06em 0 var(--tomato)}
#gate h1 span:nth-child(2){animation-delay:-.15s} #gate h1 span:nth-child(3){animation-delay:-.3s}
#gate h1 span:nth-child(4){animation-delay:-.45s} #gate h1 span:nth-child(5){animation-delay:-.6s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-.12em) rotate(4deg)}}
#go{font-family:var(--f-lat);font-size:clamp(20px,3vw,28px);background:var(--ink);color:var(--sun);border:0;padding:16px 38px;cursor:pointer;box-shadow:6px 6px 0 var(--tomato);transition:transform .1s,box-shadow .1s}
#go:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--tomato)}
#go:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--tomato)}
#gate .note{font-size:12px;line-height:1.7;max-width:40ch}

@media (prefers-reduced-motion:reduce){ #gate h1 span{animation:none} }
</style>
<style>body{margin:0}</style>
</head>
<body>
<div id="bg"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="txt" aria-live="polite"></div>
<div id="info"></div>
<div id="flash"></div>
<div id="ctrl">
  <button id="again" type="button">もう一回</button>
  <button id="mute" type="button" aria-pressed="false">BGM ON</button>
</div>
<button id="sndHint" type="button" hidden>音が出ない場合はここをタップ</button>

<div id="gate">
  <div class="k">KINETIC TYPE · 126 BPM</div>
  <h1><span>日</span><span>付</span><span>が</span><span>踊</span><span>る</span></h1>
  <button id="go" type="button">PLAY</button>
  <div class="note">音楽が流れます（歌はありません）。約12秒の場面転換のあとに今日の日付が出て、そのまま踊り続けます。iPhoneはマナーモード解除推奨。</div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BPM = 126, B = 60 / BPM, Q = B / 4;
const C = { ink: '#141016', cream: '#fff4e0', tomato: '#ff4d2e', cobalt: '#2340ff', sun: '#ffd21f', pink: '#ff7ac8', mint: '#29e3a2' };
const PAL = [C.tomato, C.sun, C.pink, C.mint, C.cobalt];
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const BG = $('#bg'), TX = $('#txt'), body = document.body;

/* ---------- date ---------- */
const WAFU = ['睦月','如月','弥生','卯月','皐月','水無月','文月','葉月','長月','神無月','霜月','師走'];
const MON_E = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const WD_E = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const wd = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - wd);
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}
function dateInfo(n = new Date()) {
  const y = n.getFullYear(), m = n.getMonth() + 1, d = n.getDate(), w = n.getDay();
  const s = new Date(y, 0, 1), doy = Math.round((new Date(y, m - 1, d) - s) / 864e5) + 1;
  const total = Math.round((new Date(y + 1, 0, 1) - s) / 864e5), r = y - 2018;
  return { y, m, d, w, doy, total, left: total - doy, wk: isoWeek(n), wafu: WAFU[m - 1],
    first: new Date(y, m - 1, 1).getDay(), dim: new Date(y, m, 0).getDate(),
    wdJ: '日月火水木金土'[w] + '曜日', wdE: WD_E[w], monE: MON_E[m - 1],
    era: y >= 2019 ? `令和${r === 1 ? '元' : r}年` : `平成${y - 1988}年` };
}
let I = dateInfo();

/* ---------- audio ---------- */
let ac = null, comp, master, reverb, noiseBuf, bus, send, muted = false;
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function initAudio() {
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
  comp = ac.createDynamicsCompressor(); comp.threshold.value = -15; comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .18;
  master = ac.createGain(); master.gain.value = .9; comp.connect(master); master.connect(ac.destination);
  const len = ac.sampleRate * 1.6, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const a = ir.getChannelData(c); for (let i = 0; i < len; i++) a[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  reverb = ac.createConvolver(); reverb.buffer = ir; reverb.connect(comp);
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
function newBus() {
  if (!ac) return;
  if (bus) { const ob = bus, os = send; ob.gain.setTargetAtTime(0, ac.currentTime, .02); os.gain.setTargetAtTime(0, ac.currentTime, .02); setTimeout(() => { ob.disconnect(); os.disconnect(); }, 300); }
  bus = ac.createGain(); bus.connect(comp); send = ac.createGain(); send.gain.value = .3; send.connect(reverb);
}
const now = () => ac ? ac.currentTime : performance.now() / 1000;
function out(n, wet = 0) { n.connect(bus); if (wet) { const g = ac.createGain(); g.gain.value = wet; n.connect(g); g.connect(send); } }
function noise(t, dur) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(t, Math.random()); s.stop(t + dur + .05); return s; }
function filt(type, f, q = 1) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
function env(g, t, a, p, d) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(p, .0002), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
function hold(g, t, v, dur, rel = .08, att = .006) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + att); g.gain.setValueAtTime(v, t + Math.max(att, dur)); g.gain.exponentialRampToValueAtTime(.0001, t + Math.max(att, dur) + rel); }
function osc(type, f, t, dur, det = 0) { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = det; o.start(t); o.stop(t + dur + .2); return o; }
const S = {
  kick(t, v = 1) {
    const o = osc('sine', 150, t, .4), g = ac.createGain(); o.frequency.exponentialRampToValueAtTime(45, t + .1);
    env(g, t, .002, v, .34); o.connect(g); out(g);
    const n = noise(t, .02), h = filt('highpass', 2500), g2 = ac.createGain(); env(g2, t, .001, v * .25, .02); n.connect(h); h.connect(g2); out(g2);
  },
  clap(t, v = .35) {
    const n = noise(t, .3), f = filt('bandpass', 1300, 1.2), g = ac.createGain();
    g.gain.setValueAtTime(.0001, t);
    [0, .011, .022].forEach(o => { g.gain.setValueAtTime(v, t + o); g.gain.exponentialRampToValueAtTime(v * .2, t + o + .009); });
    g.gain.setValueAtTime(v, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + .2);
    n.connect(f); f.connect(g); out(g, .3);
  },
  snare(t, v = .3) {
    const n = noise(t, .2), f = filt('bandpass', 2000, .7), g = ac.createGain(); env(g, t, .001, v, .14); n.connect(f); f.connect(g); out(g, .2);
    const o = osc('triangle', 220, t, .1), g2 = ac.createGain(); env(g2, t, .001, v * .5, .07); o.connect(g2); out(g2);
  },
  hat(t, v = .04, open = false) { const n = noise(t, open ? .25 : .05), f = filt('highpass', 7800), g = ac.createGain(); env(g, t, .001, v, open ? .2 : .03); n.connect(f); f.connect(g); out(g); },
  crash(t, v = .25) { const n = noise(t, 1.8), f = filt('highpass', 4200), g = ac.createGain(); env(g, t, .002, v, 1.5); n.connect(f); f.connect(g); out(g, .5); },
  bass(t, m, dur, v = .24) {
    const lp = filt('lowpass', 2400, 6), g = ac.createGain();
    lp.frequency.setValueAtTime(2400, t); lp.frequency.exponentialRampToValueAtTime(260, t + .12);
    osc('sawtooth', mf(m), t, dur).connect(lp); osc('square', mf(m), t, dur, 6).connect(lp);
    hold(g, t, v * .6, dur, .04); lp.connect(g); out(g);
    const s = osc('sine', mf(m), t, dur), sg = ac.createGain(); hold(sg, t, v, dur, .04); s.connect(sg); out(sg);
  },
  stab(t, ms, v = .045) {
    const lp = filt('lowpass', 2800, 1), g = ac.createGain();
    ms.forEach(m => { osc('square', mf(m), t, .15).connect(lp); osc('sine', mf(m + 12), t, .15).connect(lp); });
    env(g, t, .002, v, .12); lp.connect(g); out(g, .3);
  },
  brass(t, ms, dur, v = .08) {
    const lp = filt('lowpass', 500, 2), g = ac.createGain();
    lp.frequency.setValueAtTime(500, t); lp.frequency.exponentialRampToValueAtTime(3200, t + .07); lp.frequency.exponentialRampToValueAtTime(1500, t + dur);
    ms.forEach(m => [-9, 0, 9].forEach(d => osc('sawtooth', mf(m), t, dur, d).connect(lp)));
    hold(g, t, v, dur, .15, .025); lp.connect(g); out(g, .35);
  },
  pad(t, ms, dur, v = .025, cut = 1500) {
    const lp = filt('lowpass', cut), g = ac.createGain();
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + dur * .25); g.gain.setValueAtTime(v, t + dur * .85); g.gain.linearRampToValueAtTime(.0001, t + dur);
    ms.forEach(m => [-10, 10].forEach(d => osc('sawtooth', mf(m), t, dur, d).connect(lp)));
    lp.connect(g); out(g, .5);
  },
  lead(t, m, dur, v = .05) {
    const lp = filt('lowpass', 3200, 2), g = ac.createGain();
    osc('square', mf(m), t, dur).connect(lp); osc('sawtooth', mf(m), t, dur, 8).connect(lp);
    hold(g, t, v, dur, .06); lp.connect(g); out(g, .3);
  },
  pop(t, v = .22) { const o = osc('sine', 1200, t, .1), g = ac.createGain(); o.frequency.exponentialRampToValueAtTime(220, t + .07); env(g, t, .002, v, .08); o.connect(g); out(g, .15); },
  tick(t, v = .12) { const o = osc('sine', 2300, t, .05), g = ac.createGain(); env(g, t, .001, v, .03); o.connect(g); out(g); },
  ding(t) { [1568, 2093, 3136].forEach((f, i) => { const o = osc('sine', f, t, .9), g = ac.createGain(); env(g, t, .003, .12 / (i + 1), .8); o.connect(g); out(g, .4); }); },
  whoosh(t, dur = .35, v = .16) { const n = noise(t, dur), bp = filt('bandpass', 6000, 2), g = ac.createGain(); bp.frequency.setValueAtTime(600, t); bp.frequency.exponentialRampToValueAtTime(7000, t + dur); env(g, t, dur * .6, v, dur * .4); n.connect(bp); bp.connect(g); out(g, .3); },
  riser(t, dur, v = .25) {
    const n = noise(t, dur), bp = filt('bandpass', 500, 5), g = ac.createGain();
    bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(8000, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + dur); g.gain.exponentialRampToValueAtTime(.0001, t + dur + .03);
    n.connect(bp); bp.connect(g); out(g, .3);
  },
  boom(t, v = 1) {
    const o = osc('sine', 90, t, 1.4), g = ac.createGain(); o.frequency.exponentialRampToValueAtTime(30, t + 1); env(g, t, .003, v, 1.2); o.connect(g); out(g, .3);
    const n = noise(t, 1), lp = filt('lowpass', 8000), g2 = ac.createGain(); lp.frequency.setValueAtTime(8000, t); lp.frequency.exponentialRampToValueAtTime(150, t + .8);
    env(g2, t, .002, v * .45, .9); n.connect(lp); lp.connect(g2); out(g2, .5);
  }
};

/* ii–V–I–vi in C: Dm7 G7 Cmaj7 Am7 */
const CH = [
  { root: 38, pad: [62, 65, 69, 72] }, { root: 43, pad: [59, 62, 65, 67] },
  { root: 36, pad: [60, 64, 67, 71] }, { root: 45, pad: [60, 64, 67, 69] },
];
const BASS = [[0, 0, 2], [3, 12, 1], [6, 0, 2], [8, 0, 1], [10, 12, 1], [11, 10, 1], [14, 7, 2]];
const STAB = [2, 7, 10];
const RIFF = [
  [[0, 74, 2], [2, 72, 1], [3, 74, 2], [6, 77, 2], [8, 74, 2], [11, 72, 1], [12, 69, 4]],
  [[0, 71, 2], [2, 74, 1], [3, 77, 2], [6, 79, 2], [8, 77, 2], [11, 74, 1], [12, 71, 4]],
  [[0, 72, 2], [2, 76, 1], [3, 79, 2], [6, 84, 2], [8, 79, 2], [11, 76, 1], [12, 79, 4]],
  [[0, 81, 3], [3, 79, 1], [4, 76, 2], [6, 72, 2], [8, 74, 2], [10, 76, 2], [12, 72, 4]],
];
function stepAt(i, t, mode, sec = 0) {
  const s = i % 16, bar = i / 16 | 0, ch = CH[bar % 4];
  if (s % 4 === 0) S.kick(t, mode === 'intro' ? .85 : 1);
  if (mode === 'intro') {

$('#go').addEventListener('click', () => { unlockAudio(); $('#gate').classList.add('gone'); startRun(); checkSound(); });
$('#again').addEventListener('click', () => { unlockAudio(); startRun(); checkSound(); });
$('#sndHint').addEventListener('click', () => { unlockAudio(); checkSound(); });
$('#mute').addEventListener('click', e => {
  muted = !muted; e.currentTarget.textContent = muted ? 'BGM OFF' : 'BGM ON'; e.currentTarget.setAttribute('aria-pressed', String(muted));
  if (ac) master.gain.setTargetAtTime(muted ? 0 : .9, ac.currentTime, .05);
});
})();
</script>
</body>
</html>
